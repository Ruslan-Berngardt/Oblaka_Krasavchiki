user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1r/s;
    upstream backend_pool {
        server backend-1:3000 max_fails=2 fail_timeout=5s;
        server backend-2:3000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name kadr.local second.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name kadr.local;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        root /var/www/frontend;
        index index.html;
        client_max_body_size 32k;

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html { root /var/www/error-pages; internal; }
        location = /50x.html { root /var/www/error-pages; internal; }

        location /api/ {
            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        }

        location = /admin {
            auth_basic "Admin Area";
            auth_basic_user_file /etc/nginx/.htpasswd;
            alias /etc/nginx/admin.html;
            default_type text/html;
        }

        location /docs {
            alias /var/www/docs;
            autoindex on;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 443 ssl;
        server_name second.local;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        root /var/www/second-site;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}