name: kadr
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kadr}
      POSTGRES_DB: ${POSTGRES_DB:-kadr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Сначала запустите scripts/setup-docker-env.sh или scripts/setup-docker-env.ps1}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kadr}:${POSTGRES_PASSWORD:?Нужен локальный .env.docker}@db:5432/${POSTGRES_DB:-kadr}
      PORT: 3000
      COOKIE_SECURE: "false"
    networks: [application, database]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    networks: [application]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
networks:
  application:
  database:
    internal: true
